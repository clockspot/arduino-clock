; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; The sketch files live at the repo root rather than the conventional src/
; directory so that the same files can be opened by Arduino IDE (where the
; repo folder doubles as the sketch folder).

[platformio]
src_dir = .

[env]
framework = arduino
build_flags = -I${PROJECT_DIR}

; -----------------------------------------------------------------------------
; Hardware environments
; -----------------------------------------------------------------------------
; Uncomment / adjust to match your build target. Each board generally pairs
; with a particular config in configs/ — copy config.example.h to config.h and
; pick the matching one before building.

; Arduino Nano (classic AVR) — for undb-v5/v8/v9 nixie hardware
; [env:nano]
; platform = atmelavr
; board = nanoatmega328
; lib_deps =
;     NorthernWidget/DS3231

; Arduino Nano 33 IoT — for *-iot configs (WiFiNINA)
; [env:nano_33_iot]
; platform = atmelsam
; board = nano_33_iot
; lib_deps =
;     NorthernWidget/DS3231
;     arduino-libraries/WiFiNINA

; Adafruit QT Py ESP32-S2 — for esp32-* configs
; [env:esp32_s2]
; platform = espressif32
; board = adafruit_qtpy_esp32s2

; -----------------------------------------------------------------------------
; Native (host) environment — for unit tests only
; -----------------------------------------------------------------------------
; Runs Unity tests on the host machine (no hardware needed). Tests live under
; test/ and pull in only the modules that are free of Arduino.h dependencies
; (e.g. datetime). Run with: pio test -e native

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_src_filter = +<datetime.cpp>
