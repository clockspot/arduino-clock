; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; The repo root doubles as an Arduino IDE sketch folder: arduino-clock.ino
; (an empty marker) lives at the root, while the actual code is in src/main.cpp
; and module files. This way both Arduino IDE (which compiles src/ recursively
; from the sketch) and PlatformIO (which uses src_dir = src by default) can
; build the same tree. Configuration headers live in include/ to keep the root
; uncluttered; build_flags adds the project root so that src/ files can include
; "include/..." paths (Arduino IDE adds the sketch root to the include path
; automatically, so the same #include lines resolve there too).

[platformio]
default_envs = nano

[env]
framework = arduino
build_flags = -I${PROJECT_DIR}

; -----------------------------------------------------------------------------
; Hardware environments
; -----------------------------------------------------------------------------
; Each env pairs with a family of configs in include/configs/ — copy
; include/config.example.h to include/config.h and uncomment the matching one
; before building. lib_deps lists every library that any config in the family
; might need; PlatformIO auto-installs these into .pio/libdeps/<env>/ on first
; build, but only those actually referenced via #include get linked into the
; firmware. Switch envs in the VS Code status bar or with `pio run -e <env>`.

; Arduino Nano (classic AVR) — for ardavr-* configs (UNDB v5/v8/v9 nixie, 7seg, matrix).
; PlatformIO Nano boards (counterintuitive — naming inherited from Arduino IDE):
;   `nanoatmega328`    — Old Bootloader (ATmegaBOOT, uploads at 57600 baud).
;   `nanoatmega328new` — New Bootloader (optiboot, uploads at 115200 baud).
; If upload fails with `stk500_recv: programmer is not responding`, try the
; other one — the symptom is the bootloader expecting a different baud rate.
[env:nano]
platform = atmelavr
board = nanoatmega328new
lib_deps =
    adafruit/RTClib
    dmkishi/Dusk2Dawn
    paulstoffregen/Encoder
    adafruit/Adafruit GFX Library
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit VEML7700 Library
    wayoda/LedControl

; Arduino Nano 33 IoT (SAMD21) — for ardiot-* configs (WiFiNINA, IMU)
[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
lib_deps =
    adafruit/RTClib
    https://github.com/dmkishi/Dusk2Dawn.git ; registry version uses `static` on out-of-line member defs which arm-gcc rejects; GitHub master has the fix
    paulstoffregen/Encoder
    adafruit/Adafruit GFX Library
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit VEML7700 Library
    wayoda/LedControl
    arduino-libraries/Arduino_LSM6DS3
    arduino-libraries/WiFiNINA
    cmaglie/FlashStorage

; Adafruit QT Py ESP32-S2 — for esp32-* configs
; [env:esp32_s2]
; platform = espressif32
; board = adafruit_qtpy_esp32s2
; lib_deps =
;     adafruit/RTClib
;     https://github.com/dmkishi/Dusk2Dawn.git ; registry version's `static` on out-of-line defs is rejected by modern toolchains
;     adafruit/Adafruit GFX Library
;     adafruit/Adafruit LED Backpack Library
;     adafruit/Adafruit VEML7700 Library
;     adafruit/Adafruit NeoPixel

; -----------------------------------------------------------------------------
; Native (host) environment — for unit tests only
; -----------------------------------------------------------------------------
; Runs Unity tests on the host machine (no hardware needed). Tests live under
; test/ and pull in only the modules that are free of Arduino.h dependencies
; (e.g. datetime). Run with: pio test -e native

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_src_filter = +<datetime.cpp>
